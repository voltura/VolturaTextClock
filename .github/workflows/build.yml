name: Build and validate clock
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build VolturaTextClock.sln -c Release
      - run: dotnet run --project tests/ClockSmoke/ClockSmoke.csproj -c Release
      - run: dotnet publish VolturaTextClock/VolturaTextClock.csproj -c Release -r win-x64 --self-contained true -o artifacts/clock
      - uses: actions/upload-artifact@v4
        with:
          name: VolturaTextClock-win-x64
          path: artifacts/clock
